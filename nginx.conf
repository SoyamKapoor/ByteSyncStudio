# ==============================================================================
# ByteSync Studio - Production Nginx Reverse Proxy & Security Hardening Configuration
# ==============================================================================

# Rate limiting zones: Protect consultation submissions and admin auth from DDoS/brute-force
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=5r/m;

# ------------------------------------------------------------------------------
# 1. Global HTTP to HTTPS Redirection (Port 80 -> Port 443)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name bytesyncstudio.com www.bytesyncstudio.com;

    # Let's Encrypt / ACME challenge verification path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Permanent 301 Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Hardened HTTPS Server (Port 443)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bytesyncstudio.com www.bytesyncstudio.com;

    # SSL Certificates (Configure paths to your production certificates, e.g., Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/bytesyncstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bytesyncstudio.com/privkey.pem;

    # SSL Protocol & Modern Cipher Negotiation (TLS 1.2 & 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization & OCSP Stapling
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Buffer & Body Size Restrictions (DDoS Mitigation)
    client_max_body_size 50k;
    client_body_buffer_size 50k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Gzip Compression for Performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff font/woff2 image/svg+xml;

    # ==========================================================================
    # MANDATORY PRE-LIVE SECURITY HEADERS
    # ==========================================================================
    # HTTP Strict Transport Security (HSTS): 2 years with preloading
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # Prevent MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Prevent clickjacking / frame injection
    add_header X-Frame-Options "DENY" always;
    # Privacy Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Disable risky device sensors
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Content-Security-Policy (CSP)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none';" always;

    # --------------------------------------------------------------------------
    # Static Assets Caching
    # --------------------------------------------------------------------------
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # --------------------------------------------------------------------------
    # API: Consultation Submission Rate Limiting
    # --------------------------------------------------------------------------
    location /api/consultations {
        limit_req zone=api_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # API: Admin Login Brute-Force Rate Limiting
    # --------------------------------------------------------------------------
    location /api/admin/login {
        limit_req zone=admin_limit burst=2 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Reverse Proxy to Node.js Backend Application
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

